<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="gradLogoCasona" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C92A34"/>
      <stop offset="100%" stop-color="#7A1318"/>
    </linearGradient>
  </defs>
  <!-- Icon: Casona (Colonial house / arch + shopping handle) -->
