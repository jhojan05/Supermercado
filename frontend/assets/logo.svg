  <!-- Text -->
  <text x="60" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#7A1318" letter-spacing="-0.3">Supermercado</text>
  <text x="60" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#C92A34" letter-spacing="1.2">LA CASONA</text>
  <circle cx="198" cy="42" r="3.5" fill="#D97706" />
</svg>